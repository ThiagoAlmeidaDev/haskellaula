# Banco de desenvolvimento: PostgreSQL 16 na porta 5432, com db/schema.sql aplicado no primeiro
# boot do volume. As credenciais flashcards/flashcards valem só para uso local.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flashcards
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - dados:/var/lib/postgresql/data

volumes:
  dados:
